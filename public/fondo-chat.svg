<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!--
    El fondo del chat, como el papel de una libreta: una baldosa de 320 px que
    se repite. Los dibujos son los del CRM —el mensaje, la nota de voz, la
    cita, el tilde doble— y no los de WhatsApp, que son de otra marca.

    El trazo es un gris cálido a media luz: el mismo archivo sirve en los dos
    modos, tenue sobre el crema y tenue sobre el casi negro. Va suelto de los
    bordes para que la baldosa no muestre el corte al repetirse.
  -->
